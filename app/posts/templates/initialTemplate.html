<!DOCTYPE html>
<html>
  <body>
    <h1>Hello World!</h1>
    <p>Welcome to my first Django project!</p>
    <ul>
      {%for post in allFeed%}
      <li>
        Post: {{post.body}}
        <ul>
          <li>Likes: {{post.likes.count}}</li>
          <li>Comment: {{post.comments.count}}</li>
        </ul>
      </li>
      {%endfor%}
    </ul>
  </body>
</html>
